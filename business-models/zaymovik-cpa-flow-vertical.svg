<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc">
  <title id="title">Вертикальная схема CPA-модели Zaymovik</title>
  <desc id="desc">Трафик из CPA-сетей распределяется между несколькими сайтами, затем заявки поступают в единую платформу и направляются балансировщиком в одну из МФО.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .layer { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; fill: #64748b; }
      .label { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .note { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .box { stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="1660" fill="#ffffff"/>
  <text x="600" y="48" class="title" text-anchor="middle">CPA-модель Zaymovik</text>

  <rect x="24" y="75" width="1152" height="490" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="110" class="layer">ПРИВЛЕЧЕНИЕ</text>

  <rect class="box" x="260" y="125" width="680" height="86" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="600" y="176" class="label">Веб-мастера и финансовые витрины</text>

  <rect class="box" x="410" y="255" width="380" height="78" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="600" y="303" class="label">CPA-сети</text>

  <rect class="box" x="80" y="415" width="300" height="90" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="230" y="452" class="label">
    <tspan x="230">Оффер A</tspan>
    <tspan x="230" dy="27" class="small">сайт Zaymovik</tspan>
  </text>

  <rect class="box" x="450" y="415" width="300" height="90" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="452" class="label">
    <tspan x="600">Оффер B</tspan>
    <tspan x="600" dy="27" class="small">отдельный бренд</tspan>
  </text>

  <rect class="box" x="820" y="415" width="300" height="90" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="970" y="452" class="label">
    <tspan x="970">Оффер C</tspan>
    <tspan x="970" dy="27" class="small">отдельный бренд</tspan>
  </text>

  <path class="arrow" d="M600 211 V255"/>
  <path class="arrow" d="M600 333 V365 H230 V415"/>
  <path class="arrow" d="M600 333 V415"/>
  <path class="arrow" d="M600 333 V365 H970 V415"/>

  <rect x="24" y="590" width="1152" height="600" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="50" y="625" class="layer">ЕДИНАЯ ПЛАТФОРМА</text>

  <rect class="box" x="300" y="660" width="600" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="600" y="697" class="label">
    <tspan x="600">Единый приём заявок</tspan>
    <tspan x="600" dy="27" class="small">общая база для всех сайтов</tspan>
  </text>

  <path class="arrow" d="M230 505 V575 H480 V660"/>
  <path class="arrow" d="M600 505 V660"/>
  <path class="arrow" d="M970 505 V575 H720 V660"/>

  <rect class="box" x="300" y="815" width="600" height="100" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="600" y="852" class="label">
    <tspan x="600">Валидация заявки</tspan>
    <tspan x="600" dy="28" class="small">антифрод · межбрендовая дедупликация</tspan>
  </text>

  <path class="arrow" d="M600 750 V815"/>

  <polygon class="box" points="600,960 920,1050 600,1140 280,1050" fill="#fed7aa" stroke="#f97316"/>
  <text x="600" y="1039" class="label">
    <tspan x="600">Балансировщик</tspan>
    <tspan x="600" dy="28" class="small">выбирает одну доступную МФО</tspan>
  </text>

  <path class="arrow" d="M600 915 V960"/>

  <rect x="24" y="1215" width="1152" height="420" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="50" y="1250" class="layer">ПАРТНЁРЫ И РЕЗУЛЬТАТ</text>
  <text x="600" y="1260" class="note">Для каждой заявки используется только один маршрут</text>

  <rect class="box" x="80" y="1300" width="300" height="90" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="230" y="1337" class="label">
    <tspan x="230">МФО 1</tspan>
    <tspan x="230" dy="27" class="small">скоринг · ПДН · решение</tspan>
  </text>

  <rect class="box" x="450" y="1300" width="300" height="90" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="600" y="1337" class="label">
    <tspan x="600">МФО 2</tspan>
    <tspan x="600" dy="27" class="small">скоринг · ПДН · решение</tspan>
  </text>

  <rect class="box" x="820" y="1300" width="300" height="90" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="970" y="1337" class="label">
    <tspan x="970">МФО N</tspan>
    <tspan x="970" dy="27" class="small">скоринг · ПДН · решение</tspan>
  </text>

  <path class="arrow" d="M520 1118 V1170 H230 V1300"/>
  <path class="arrow" d="M600 1140 V1300"/>
  <path class="arrow" d="M680 1118 V1170 H970 V1300"/>

  <rect class="box" x="250" y="1480" width="700" height="100" rx="16" fill="#e2e8f0" stroke="#64748b"/>
  <text x="600" y="1517" class="label">
    <tspan x="600">Результат и экономика</tspan>
    <tspan x="600" dy="28" class="small">отказ · одобрение · выдача · маржа</tspan>
  </text>

  <path class="arrow" d="M230 1390 V1440 H460 V1480"/>
  <path class="arrow" d="M600 1390 V1480"/>
  <path class="arrow" d="M970 1390 V1440 H740 V1480"/>

  <path class="feedback" d="M950 1530 H1120 V1050 H920"/>
  <text x="1092" y="1290" class="note" transform="rotate(-90 1092 1290)">корректировка правил распределения</text>
</svg>
