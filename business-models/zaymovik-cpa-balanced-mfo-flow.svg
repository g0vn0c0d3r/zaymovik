<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc">
  <title id="title">Zaymovik — путь заявки</title>
  <desc id="desc">Источники трафика ведут на разные сайты. Клиент вводит имя и телефон. По номеру телефона проверяется единая база клиентов: новый регистрируется по SMS, существующий входит по SMS. В едином ЛК клиент заполняет заявку. Скоринг оценивает заявку: отказ ведёт на отказную витрину, прохождение порога отсечения означает допуск к выдаче. Балансировщик выбирает одну готовую выдать МФО, учитывая историю клиента у каждого кредитора, активные займы, ликвидность и лимиты. По правилу платформы исключаются МФО, где у клиента есть активный заём; погашенный заём сам по себе не исключает МФО. Выбранная МФО оформляет и выдаёт заём. В этой модели переход на отказную витрину предусмотрен только от скоринга.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size:36px; font-weight:700; fill:#0f172a; text-anchor:middle; }
      .layer { font-size:18px; font-weight:700; letter-spacing:1.4px; fill:#64748b; }
      .label { font-size:24px; font-weight:600; fill:#0f172a; text-anchor:middle; }
      .small { font-size:18px; font-weight:400; fill:#334155; text-anchor:middle; }
      .note { font-size:17px; font-weight:400; fill:#475569; text-anchor:middle; }
      .connector { fill:none; stroke:#475569; stroke-width:3; stroke-linejoin:round; }
      .arrow { fill:none; stroke:#475569; stroke-width:3; stroke-linejoin:round; marker-end:url(#arrow); }
      .box { stroke-width:2; }
    </style>
  </defs>
  <rect width="1200" height="1660" fill="#ffffff"/>
  <text x="600" y="48" class="title">Модель Zaymovik</text>

  <rect x="24" y="75" width="1152" height="490" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="110" class="layer">ПРИВЛЕЧЕНИЕ</text>
  <rect class="box" x="180" y="135" width="840" height="110" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="600" y="172" class="label">
    <tspan x="600">Источники трафика</tspan>
    <tspan x="600" dy="29" class="small">CPA-сети · контекст · соцсети · другие каналы</tspan>
    <tspan x="600" dy="27" class="note">Одни и те же каналы для разных сайтов</tspan>
  </text>
  <path class="connector" d="M600 245 V275 M210 275 H990"/>
  <path class="arrow" d="M210 275 V310"/>
  <path class="arrow" d="M600 275 V310"/>
  <path class="arrow" d="M990 275 V310"/>

  <rect id="site-a" class="box" x="60" y="310" width="300" height="80" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="210" y="359" class="label">Сайт A</text>
  <rect id="site-b" class="box" x="450" y="310" width="300" height="80" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="359" class="label">Сайт B</text>
  <rect id="site-new" class="box" x="840" y="310" width="300" height="80" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="8 6"/>
  <text x="990" y="359" class="label">+ Новый сайт</text>

  <path class="connector" d="M210 390 V420 H990 V390 M600 390 V420"/>
  <path class="arrow" d="M600 420 V445"/>
  <rect id="first-step" class="box" x="340" y="445" width="520" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="600" y="482" class="label">Первый шаг на выбранном сайте</text>
  <text x="600" y="511" class="small">Имя · телефон</text>

  <rect x="24" y="590" width="1152" height="800" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="50" y="625" class="layer">ЕДИНАЯ ПЛАТФОРМА</text>
  <path class="arrow" d="M600 535 V655"/>
  <rect id="intake" class="box" x="340" y="655" width="520" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="600" y="692" class="label">Единая база клиентов</text>
  <text x="600" y="721" class="small">Поиск по номеру телефона</text>

  <path class="connector" d="M600 745 V775 M325 775 H875"/>
  <path class="arrow" d="M325 775 V805"/>
  <path class="arrow" d="M875 775 V805"/>
  <rect id="register" class="box" x="160" y="805" width="330" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="325" y="842" class="label">Новый клиент</text>
  <text x="325" y="871" class="small">Регистрация по SMS</text>
  <rect id="login" class="box" x="710" y="805" width="330" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="875" y="842" class="label">Клиент уже есть</text>
  <text x="875" y="871" class="small">Вход по SMS</text>
  <path class="connector" d="M325 895 V925 H875 V895"/>
  <path class="arrow" d="M600 925 V955"/>

  <rect id="single-account" class="box" x="340" y="955" width="520" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="600" y="992" class="label">Единый ЛК Zaymovik</text>
  <text x="600" y="1021" class="small">Заполнение заявки</text>

  <path class="arrow" d="M600 1045 V1105"/>
  <rect id="scoring" class="box" x="340" y="1105" width="520" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="600" y="1142" class="label">Скоринг</text>
  <text x="600" y="1171" class="small">Оценка заявки</text>
  <path id="scoring-rejection" class="arrow" d="M860 1150 H920"/>
  <text x="890" y="1133" class="note">Отказ</text>

  <rect id="refusal-showcase" class="box" x="920" y="1105" width="240" height="90" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1040" y="1142" class="label">Отказная витрина</text>
  <text x="1040" y="1171" class="small">Внешние МФО</text>

  <path class="arrow" d="M600 1195 V1255"/>
  <text x="680" y="1231" class="note">Пройден</text>
  <rect id="balancer" class="box" x="340" y="1255" width="520" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="600" y="1292" class="label">Балансировщик</text>
  <text x="600" y="1321" class="small">История клиента · активные займы · ликвидность</text>

  <rect x="24" y="1415" width="1152" height="220" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="50" y="1450" class="layer">ПУЛ МФО</text>
  <text x="1145" y="1450" class="note" style="text-anchor:end">Свои МФО + партнёры</text>
  <path class="connector" d="M600 1345 V1465 M210 1465 H990"/>
  <text x="735" y="1377" class="note">В одну подходящую МФО</text>
  <path class="arrow" d="M210 1465 V1495"/>
  <path class="arrow" d="M600 1465 V1495"/>
  <path class="arrow" d="M990 1465 V1495"/>
  <rect class="box" x="60" y="1495" width="300" height="80" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="210" y="1544" class="label">МФО 1</text>
  <rect class="box" x="450" y="1495" width="300" height="80" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="600" y="1544" class="label">МФО 2</text>
  <rect class="box" x="840" y="1495" width="300" height="80" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="990" y="1544" class="label">МФО N</text>
  <text x="600" y="1610" class="small">Оформление и выдача</text>
</svg>
