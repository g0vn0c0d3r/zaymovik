<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Схема CPA-модели Zaymovik</title>
  <desc id="desc">Несколько CPA-офферов передают заявки в единую платформу, которая проверяет их и направляет в одну из МФО.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .layer { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; fill: #64748b; }
      .label { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .box { stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1800" height="900" fill="#ffffff"/>
  <text x="900" y="46" class="title" text-anchor="middle">CPA-модель Zaymovik</text>

  <rect x="24" y="70" width="1752" height="260" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="104" class="layer">ПРИВЛЕЧЕНИЕ</text>

  <rect x="24" y="350" width="1752" height="220" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="50" y="384" class="layer">ЕДИНАЯ ПЛАТФОРМА</text>

  <rect x="24" y="590" width="1752" height="286" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="50" y="624" class="layer">ПАРТНЁРЫ И РЕЗУЛЬТАТ</text>

  <rect class="box" x="70" y="150" width="260" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="200" y="187" class="label">
    <tspan x="200">Веб-мастера</tspan>
    <tspan x="200" dy="28">и витрины</tspan>
  </text>

  <rect class="box" x="410" y="150" width="190" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="505" y="203" class="label">CPA-сети</text>

  <rect class="box" x="690" y="84" width="330" height="64" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="855" y="112" class="label">
    <tspan x="855">Оффер A</tspan>
    <tspan x="855" dy="24" class="small">сайт Zaymovik</tspan>
  </text>

  <rect class="box" x="690" y="168" width="330" height="64" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="855" y="196" class="label">
    <tspan x="855">Оффер B</tspan>
    <tspan x="855" dy="24" class="small">отдельный бренд</tspan>
  </text>

  <rect class="box" x="690" y="252" width="330" height="64" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="855" y="280" class="label">
    <tspan x="855">Оффер C</tspan>
    <tspan x="855" dy="24" class="small">отдельный бренд</tspan>
  </text>

  <path class="arrow" d="M330 195 H410"/>
  <path class="arrow" d="M600 195 H650 V116 H690"/>
  <path class="arrow" d="M600 195 H690"/>
  <path class="arrow" d="M600 195 H650 V284 H690"/>

  <rect class="box" x="630" y="420" width="340" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="800" y="458" class="label">
    <tspan x="800">Единый приём</tspan>
    <tspan x="800" dy="29">заявок</tspan>
  </text>

  <rect class="box" x="1050" y="420" width="330" height="90" rx="16" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1215" y="451" class="label">
    <tspan x="1215">Валидация</tspan>
    <tspan x="1215" dy="27" class="small">антифрод · дедупликация</tspan>
  </text>

  <polygon class="box" points="1570,390 1740,465 1570,540 1400,465" fill="#fed7aa" stroke="#f97316"/>
  <text x="1570" y="459" class="label">
    <tspan x="1570">Балансировщик</tspan>
    <tspan x="1570" dy="25" class="small">выбирает одну МФО</tspan>
  </text>

  <path class="arrow" d="M1020 116 H1080 V365 H740 V420"/>
  <path class="arrow" d="M1020 200 H1110 V380 H800 V420"/>
  <path class="arrow" d="M1020 284 H1140 V395 H860 V420"/>
  <path class="arrow" d="M970 465 H1050"/>
  <path class="arrow" d="M1380 465 H1400"/>

  <rect class="box" x="690" y="660" width="250" height="86" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="815" y="711" class="label">МФО 1</text>

  <rect class="box" x="1030" y="660" width="250" height="86" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1155" y="711" class="label">МФО 2</text>

  <rect class="box" x="1370" y="660" width="250" height="86" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1495" y="711" class="label">МФО N</text>

  <path class="arrow" d="M1515 525 V610 H815 V660"/>
  <path class="arrow" d="M1570 540 V610 H1155 V660"/>
  <path class="arrow" d="M1625 525 V610 H1495 V660"/>

  <rect class="box" x="890" y="790" width="530" height="66" rx="16" fill="#e2e8f0" stroke="#64748b"/>
  <text x="1155" y="818" class="label">
    <tspan x="1155">Результат и экономика</tspan>
    <tspan x="1155" dy="24" class="small">отказ · одобрение · выдача · маржа</tspan>
  </text>

  <path class="arrow" d="M815 746 V770 H1035 V790"/>
  <path class="arrow" d="M1155 746 V790"/>
  <path class="arrow" d="M1495 746 V770 H1275 V790"/>
  <path class="feedback" d="M1420 823 H1735 V540 H1645"/>

  <text x="1690" y="692" class="small" transform="rotate(-90 1690 692)">корректировка правил</text>
</svg>
